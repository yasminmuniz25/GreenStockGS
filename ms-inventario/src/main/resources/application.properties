spring.application.name=ms-inventario

#spring.profiles.active=test
#spring.jpa.open-in-view=false
#spring.flyway.enabled=false
#
#spring.application.name=ms-inventario

# Porta aleatoria: permite varias instancias do mesmo microsservico
server.port=0

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
# instance-id unico, senao duas instancias com porta aleatoria se sobrescrevem no Eureka
eureka.instance.instance-id=${spring.application.name}:${random.value}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/greenstock_inventario?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:greenstock}
spring.datasource.password=${DB_PASSWORD:greenstock}

# JPA / Flyway
# O schema e criado exclusivamente pelas migrations (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


server.error.include-message=always
server.error.include-stacktrace=never
springdoc.swagger-ui.path=/swagger-ui.html

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
# o timelimiter padrao e 1s e derruba a primeira chamada (cold start), caindo no fallback
resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException$NotFound,feign.FeignException$UnprocessableEntity,feign.FeignException$BadRequest